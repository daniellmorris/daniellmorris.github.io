# Declarack system configuration (connections, capabilities, UI, and auth).
# Guide: docs/CONFIGURATION.md
# Complete custom API example: docs/examples/http-environments.yaml
targets:
  lab:
    label: Local Docker
    # host_root: /mnt/host  # Optional read-only mapping for reported Compose file paths.
    connection: docker_socket
    socket: /var/run/docker.sock
    features: [compose, containers, images, networks, volumes, disk_usage]

