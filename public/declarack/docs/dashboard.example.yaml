# Custom pages can query several targets; this local example uses two reads.
# See configurations/operations-dashboard.yaml for a cross-target example.
pages:
  engine:
    title: Engine dashboard
    description: Containers and Compose projects in one view.
    sources:
      containers: {target: lab, operation: containers.list}
      projects: {target: lab, operation: compose.list}
    cards:
      - label: Running containers
        sources: [containers]
        value: '$count(data.containers[State = "running"])'
      - label: Compose projects
        sources: [projects]
        value: '$count(data.projects.items)'
    panels:
      - title: Containers
        sources: [containers]
        rows: data.containers
        target: lab
        feature: containers
        row_id: Id
        columns:
          - {label: Name, value: '$join(Names, ", ")', truncate: true}
          - {label: State, value: State}
          - {label: Image, value: Image, truncate: true}
      - title: Compose projects
        sources: [projects]
        rows: data.projects.items
        target: lab
        feature: compose
        row_id: name
        columns:
          - {label: Project, value: name}
          - {label: Status, value: status}
