# Docker Desktop: Compose labels commonly refer to macOS /Users paths, not VM paths.
# docker compose -f compose.yaml -f compose.host-files.macos.yaml up -d --build
services:
  declarack:
    environment:
      DECLARACK_COMPOSE_HOST_ROOT: /mnt/host
    volumes:
      - type: bind
        source: /Users
        target: /mnt/host/Users
        read_only: true
        bind:
          create_host_path: false
