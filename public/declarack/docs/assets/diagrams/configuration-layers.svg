<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 515" role="img" aria-labelledby="title desc">
<title id="title">From deployment to the running interface</title><desc id="desc">Deployment selects one YAML source. Files merge and validate against adapter definitions. Reload activates configuration. The database holds runtime state separately.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#94a3b8"/></marker></defs>
<rect width="860" height="515" rx="12" fill="#0f172a"/>
<g font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">
<polyline points="275,105 275,145" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="330" y="130" fill="#cbd5e1" font-size="13">first / force</text>
<polyline points="25,65 10,65 10,305 25,305" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="275,225 275,265" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="347" y="250" fill="#cbd5e1" font-size="13">validate + import</text>
<polyline points="275,345 275,385" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="315" y="370" fill="#cbd5e1" font-size="13">activate</text>
<polyline points="575,195 550,195 550,305 525,305" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="525,425 575,425" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="25" width="500" height="80" rx="8" fill="#1e293b" stroke="#5ee0b2"/>
<text x="275.0" y="52" fill="#a7f3d0" font-weight="600">1. Deployment / bootstrap</text>
<text x="275.0" y="76" fill="#f1f5f9" font-size="13">Config path, database URL, mounts and credential files</text>
<rect x="25" y="145" width="500" height="80" rx="8" fill="#1e293b" stroke="#5ee0b2"/>
<text x="275.0" y="172" fill="#a7f3d0" font-weight="600">2. Import sources (optional after setup)</text>
<text x="275.0" y="196" fill="#f1f5f9" font-size="13">File/folder, Git or Swarm configuration</text>
<rect x="25" y="265" width="500" height="80" rx="8" fill="#1e293b" stroke="#5ee0b2"/>
<text x="275.0" y="292" fill="#a7f3d0" font-weight="600">3. Database configuration revisions</text>
<text x="275.0" y="316" fill="#f1f5f9" font-size="13">Original YAML documents + saved / active pointers</text>
<rect x="25" y="385" width="500" height="80" rx="8" fill="#1e293b" stroke="#5ee0b2"/>
<text x="275.0" y="412" fill="#a7f3d0" font-weight="600">4. Running interface and execution</text>
<text x="275.0" y="436" fill="#f1f5f9" font-size="13">Activate a saved revision; restart reads the active database revision</text>
<rect x="575" y="145" width="260" height="100" rx="8" fill="#1e293b" stroke="#5ee0b2"/>
<text x="705.0" y="172" fill="#a7f3d0" font-weight="600">Adapter definitions</text>
<text x="705.0" y="196" fill="#f1f5f9" font-size="13">Trusted code and bundled YAML</text>
<text x="705.0" y="217" fill="#f1f5f9" font-size="13">Connections, operations and features</text>
<rect x="575" y="365" width="260" height="100" rx="8" fill="#1e293b" stroke="#5ee0b2"/>
<text x="705.0" y="392" fill="#a7f3d0" font-weight="600">Runtime tables / documents</text>
<text x="705.0" y="416" fill="#f1f5f9" font-size="13">Same SQLite / PostgreSQL database</text>
<text x="705.0" y="437" fill="#f1f5f9" font-size="13">Sources, checks, runs and history</text>
<text x="430" y="495" fill="#cbd5e1" font-size="13">Normal restart uses the active database revision; files supply imports or optional write-back.</text>
</g>
</svg>
