<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">Local configuration editing workflow</title><desc id="desc">Edit a draft, validate the full merge, review diffs, save with a revision check, then reload to change the running system. Source history can restore a draft.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#94a3b8"/></marker></defs>
<rect width="900" height="440" rx="12" fill="#0f172a"/>
<g font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">
<polyline points="275,78 325,78" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="575,78 625,78" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="750,120 750,220" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="640" y="175" fill="#cbd5e1" font-size="13">Save does not activate</text>
<polyline points="625,260 575,260" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="325,260 275,260" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="35" width="250" height="85" rx="8" fill="#1e293b" stroke="#5ee0b2"/>
<text x="150.0" y="62" fill="#a7f3d0" font-weight="600">1. Edit a draft</text>
<text x="150.0" y="86" fill="#f1f5f9" font-size="13">Environment form or YAML editor</text>
<rect x="325" y="35" width="250" height="85" rx="8" fill="#1e293b" stroke="#5ee0b2"/>
<text x="450.0" y="62" fill="#a7f3d0" font-weight="600">2. Validate the full merge</text>
<text x="450.0" y="86" fill="#f1f5f9" font-size="13">References, inputs and schemas</text>
<rect x="625" y="35" width="250" height="85" rx="8" fill="#1e293b" stroke="#5ee0b2"/>
<text x="750.0" y="62" fill="#a7f3d0" font-weight="600">3. Review differences</text>
<text x="750.0" y="86" fill="#f1f5f9" font-size="13">Source file + effective configuration</text>
<rect x="625" y="220" width="250" height="85" rx="8" fill="#1e293b" stroke="#5ee0b2"/>
<text x="750.0" y="247" fill="#a7f3d0" font-weight="600">4. Save the reviewed revision</text>
<text x="750.0" y="271" fill="#f1f5f9" font-size="13">Store immutable documents in DB</text>
<text x="750.0" y="292" fill="#f1f5f9" font-size="13">Local revision history recorded</text>
<rect x="325" y="220" width="250" height="85" rx="8" fill="#1e293b" stroke="#5ee0b2"/>
<text x="450.0" y="247" fill="#a7f3d0" font-weight="600">5. Activate configuration</text>
<text x="450.0" y="271" fill="#f1f5f9" font-size="13">Optional file write-back first</text>
<rect x="25" y="220" width="250" height="85" rx="8" fill="#1e293b" stroke="#5ee0b2"/>
<text x="150.0" y="247" fill="#a7f3d0" font-weight="600">6. Updated running system</text>
<text x="150.0" y="271" fill="#f1f5f9" font-size="13">Navigation and behavior change</text>
<text x="450" y="355" fill="#cbd5e1" font-size="13">Saved and active DB revisions are separate. Restore history into a draft before activation.</text>
<text x="450" y="385" fill="#cbd5e1" font-size="13">File write-back uses recovery journaling. External source publication and imports are explicit.</text>
</g>
</svg>
