<text x="800.0" y="426" fill="#f1f5f9" font-size="13">HTTP, Docker, SSH, Swarm jobs</text>
<text x="480" y="505" fill="#cbd5e1" font-size="13">Root is a peer environment with special navigation capabilities, not an inheritance parent.</text>
<text x="480" y="535" fill="#cbd5e1" font-size="13">A target can belong to several environments or none. A dashboard can query targets outside its placement.</text>
<text x="480" y="565" fill="#cbd5e1" font-size="13">Checks name targets independently. Navigation placement does not grant or deny permissions.</text>
