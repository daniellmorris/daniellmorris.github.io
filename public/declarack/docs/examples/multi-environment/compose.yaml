name: declarack-lab
x-engine: &engine
  image: declarack-lab-engine:local
  build: ./engine
  privileged: true
  environment:
    DOCKER_TLS_CERTDIR: ''
  healthcheck:
    test: [CMD, docker, info]
    interval: 3s
    timeout: 3s
    retries: 40
  restart: unless-stopped
services:
  swarm-a-manager:
    <<: *engine
    hostname: swarm-a-manager
    environment: {DOCKER_TLS_CERTDIR: '', LAB_SSH: '1'}
    ports:
      - '127.0.0.1:${LAB_SSH_A_PORT:-2221}:22'
      - '127.0.0.1:${LAB_WEB_A_PORT:-18081}:8080'
    volumes:
      - a-manager-data:/var/lib/docker
      - a-manager-ssh:/var/lib/lab-ssh
      - ./runtime/client_key.pub:/run/lab/authorized_keys:ro
    networks: [swarm_a, access]
  swarm-a-worker:
    <<: *engine
    hostname: swarm-a-worker
    volumes: [a-worker-data:/var/lib/docker]
    networks: [swarm_a]
  swarm-b-manager:
    <<: *engine
    hostname: swarm-b-manager
    environment: {DOCKER_TLS_CERTDIR: '', LAB_SSH: '1'}
    ports:
      - '127.0.0.1:${LAB_SSH_B_PORT:-2222}:22'
      - '127.0.0.1:${LAB_WEB_B_PORT:-18082}:8080'
    volumes:
      - b-manager-data:/var/lib/docker
      - b-manager-ssh:/var/lib/lab-ssh
      - ./runtime/client_key.pub:/run/lab/authorized_keys:ro
    networks: [swarm_b, access]
  swarm-b-worker:
    <<: *engine
    hostname: swarm-b-worker
    volumes: [b-worker-data:/var/lib/docker]
    networks: [swarm_b]
  prometheus:
    image: prom/prometheus:v3.16.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    ports: ['127.0.0.1:${LAB_PROMETHEUS_PORT:-9090}:9090']
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    networks: [access, swarm_a, swarm_b]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/lab/grafana_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports: ['127.0.0.1:${LAB_GRAFANA_PORT:-9300}:3000']
    volumes:
      - grafana-data:/var/lib/grafana
      - ./runtime/grafana_password:/run/lab/grafana_password:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [access]
    restart: unless-stopped
  declarack:
    image: declarack-lab:local
    build: {context: ../..}
    environment:
      DECLARACK_CONFIG: /run/lab/config
      DECLARACK_CONFIG_EDIT: '1'
    ports: ['127.0.0.1:${LAB_DECLARACK_PORT:-9080}:8080']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runtime:/run/lab
      - declarack-data:/data
    networks: [access]
    restart: unless-stopped
networks:
  swarm_a: {}
  swarm_b: {}
  access: {}
volumes:
  a-manager-data: {}
  a-worker-data: {}
  b-manager-data: {}
  b-worker-data: {}
  a-manager-ssh: {}
  b-manager-ssh: {}
  prometheus-data: {}
  grafana-data: {}
  declarack-data: {}
