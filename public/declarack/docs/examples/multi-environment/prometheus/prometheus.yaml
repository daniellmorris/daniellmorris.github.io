global:
  scrape_interval: 10s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: swarm_engines
    static_configs:
      - targets: ['swarm-a-manager:9323', 'swarm-a-worker:9323']
        labels: {swarm: a}
      - targets: ['swarm-b-manager:9323', 'swarm-b-worker:9323']
        labels: {swarm: b}
  - job_name: swarm_workloads
    static_configs:
      - targets: ['swarm-a-manager:8080']
        labels: {swarm: a}
      - targets: ['swarm-b-manager:8080']
        labels: {swarm: b}
